<!DOCTYPE html>

    <script src="script.js" defer></script>
</head>
<body>

<h1>Create a Grid Container</h1>

<div class="container">
  <div style="grid-column: 1 / 3; grid-row: 1 / 2;">1</div>
  <div style="grid-column: 3 / 4; grid-row: 1 / 3;">2</div>
  <div style="grid-column: 1 / 2; grid-row: 2 / 4;">3</div>
  <div style="grid-column: 2 / 4; grid-row: 3 / 4;">4</div>

<p>Flexbox must have a parent element with the display property set to flex or inline-flex.</p>
<p>Direct child elements of the flex container automatically becomes flex items.</p>

</body>
</html>
